# Internship Hunter Configuration

scraping:
  interval_hours: 24
  max_retries: 3

notifications:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: ""
    sender_password: ""
    recipient_email: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

filters:
  keywords:
    - "intern"
    - "internship"
    - "summer"
  locations:
    - "remote"
    - "india"
  experience_level:
    - "entry"
    - "intern"
